# @package _global_
# Stage scenes: one headless push-scene agent session per prior, in a bubblewrap sandbox.
#   python humanoid_datagen/scripts/datagen.py --config_name datagen/push/agents/scenes   [dry_run: true]
defaults:
  - base
  - _self_

stage:
  _target_: humanoid_datagen.datagen_pipelines.agents.batch.AgentScenes
  dry_run: false                         # print the exact commands, prepare run dirs, write a manifest skeleton; launch nothing
  max_concurrent: 3                      # concurrent claude sessions per batch; raise it if the machine has the CPUs
  max_attempts: 2                        # re-launch a run without result.json up to this many times (old dir is archived)
  timeout_min: 180                       # wall-clock limit per session
  session_tag: ""                        # prefix of the deterministic session ids; change it to re-run the same jobs
  claude_bin: claude                     # path to the CLI

  arms:                                  # per-arm identity only; nothing here changes how the agent works
    push: {source: push_video, out_root: outputs/push_box/scenes}
    push_text: {source: push_text, out_root: outputs/push_box/scenes_text}

  jobs:
    seeds: [0]
    limit: null
    push:
      root: ${stage.priors_root}
      prior_ids: null                        # e.g. [p000, p001]; null = every prior with a video and motions
      require_file: motion_select.json       # only priors whose motions/ were picked by shared/motions.py (push_motions.sh)
      video_prefix: wan_                     # first wan_*.mp4 in the prior dir (seed 0 sorts first)
      prompt_files: [wan.txt, kimodo.txt]    # no object card: the agent estimates size, mass and friction itself

  resume:                                    # usage limit: wait for the reset, then continue the stopped sessions
    on_usage_limit: true
    limit_markers: ["hit your 5-hour limit", "hit your weekly limit", "usage limit"]
    max_waits: 10                            # sleep until the reset time in the message (+3 min), up to this many times
    fallback_wait_min: 60                    # sleep when the message has no parseable reset time
    prompt: "Continue /push-scene out={run_dir} where you left off (the session was interrupted by a usage limit). Check what is already in the run dir, then finish and finalize."

  claude:
    model: opus
    effort: max
    max_turns: 250
    max_budget_usd: 30.0
    permission_mode: dontAsk                 # anything not pre-allowed is denied, so a run can never hang on a prompt
    output_format: json
    tools: [Bash, Read, Write, Edit, Glob, Grep, Skill, WebFetch, WebSearch]
    prompt: "/push-scene out={run_dir}"
    allow:
      - "Bash"                               # its own code, tools, assets and package installs
      - "Read(//{run_dir}/**)"
      - "Edit(//{run_dir}/**)"
      - "Read(//opt/push_tools/**)"         # the tool sources (sandbox mount)
      - "Skill(push-scene)"
      - "WebFetch"
      - "WebSearch"
    deny_both:
      # No limits on what the agent does: the sandbox (isolate, below) hides the project, so the only rules here are a
      # second fence around project context and the protection of its inputs and the finalize record.
      - "Read(//{repo}/docs/**)"
      - "Read(//{repo}/outputs/generations/**)"
      - "Read(//{repo}/outputs/prompts/**)"
      - "Read(//{repo}/outputs/eval/**)"
      - "Read(//{repo}/outputs/scenes/**)"
      - "Read(//{repo}/outputs/datagen/**)"
      - "Read(//{repo}/outputs/push_box/priors_1000/**)"
      - "Read(//{repo}/outputs/push_box/test_priors/**)"
      - "Read(//{repo}/outputs/push_box/demo0/**)"
      - "Read(//{repo}/outputs/push_box/kimodo_candidates/**)"
      - "Read(//{repo}/humanoid_datagen/configs/**)"
      - "Read(//{repo}/cache/**)"
      - "Read(//{repo}/sim_scene/**)"
      - "Read(//{repo}/README.md)"
      - "Read(//{home}/.claude/projects/*/memory/**)"
      - "Read(//{home}/.claude/projects/*/*.jsonl)"
      - "Read(//{run_dir}/_driver/**)"
      - "Edit(//{run_dir}/_driver/**)"
      - "Edit(//{run_dir}/prior/**)"
      - "Edit(//{run_dir}/motions/*.csv)"
      - "Edit(//{run_dir}/.claude/**)"
      - "Edit(//{run_dir}/result.json)"
      - "Edit(//{run_dir}/tool_log.jsonl)"
    settings:                                # written to <run>/_driver/settings.json and passed with --settings
      permissions: {blockReadsOutsideWorkingDirectories: true}
      autoMemoryEnabled: false
    extra_args: [--strict-mcp-config]        # no MCP servers
    isolate_git_root: true                   # `git init` the run dir so project skills are discovered from it only
    copy_skill: humanoid_datagen/datagen_pipelines/agents/push   # the skill's source dir
    skill_name: push-scene                   # snapshot into <run>/.claude/skills/<skill_name> (cwd = run dir)
    # OS-level sandbox (humanoid_datagen/datagen_pipelines/agents/sandbox.py): the session sees only its run dir, a copy of the
    # tool code, the python env and the tracker checkpoint. This, not permission rules, is what keeps project context
    # (goals, docs, test scenes, other arms, memory) away from an agent with a free shell.
    isolate:
      enabled: true
      runtime_dir: tmp/push_box/agent_runtime          # rebuilt at batch start from `code`
      mount: /opt/push_tools
      code:                                            # the tools' import closure (datagen_pipelines/agents/cli.py)
        - humanoid_datagen/utils/paths.py
        - humanoid_datagen/utils/sonic.py
        - humanoid_datagen/datagen_pipelines/agents/cli.py
        - humanoid_datagen/datagen_pipelines/agents/scene.py
        - humanoid_datagen/datagen_pipelines/shared/compose.py
        - humanoid_datagen/datagen_pipelines/shared/run.py
        - humanoid_datagen/datagen_pipelines/shared/library.py
        - humanoid_datagen/tasks/load.py                # the task from $HDG_TASK (its config, set by agents/batch.py)
        - humanoid_datagen/tasks/base.py
        - humanoid_datagen/tasks/push/task.py
        - humanoid_datagen/tasks/push/placement.py
        - humanoid_datagen/tasks/push/stage.py
        - humanoid_datagen/tasks/push/reward.py
        - humanoid_datagen/assets/robots/g1/g1_29dof_official_oak1_mount.xml
        - humanoid_datagen/assets/robots/g1/mjcf/g1_29dof_v2_thor.xml
      library_index: utilities/library/index.pkl                      # asset index (uids, categories, sizes, CLIP features)
      library_assets: utilities/molmo-spaces-resources                # local copy of the assets the index points to
      library_exclude: humanoid_datagen/configs/eval/push/test_split.json   # held-out test assets never reach the agents
      binds:                                           # read-only: repo-relative or absolute source -> sandbox path
        humanoid_datagen/assets/robots/g1/meshes: /opt/push_tools/humanoid_datagen/assets/robots/g1/meshes
        utilities/checkpoints/gear_sonic: /opt/gear_sonic
        .venv: null                                    # null = same path inside (the env's scripts use absolute paths)
        # asset library: THOR + Objaverse home assets (MJCF, meshes, textures, colliders) and the CLIP text model
        utilities/molmo-spaces-resources: null
        utilities/huggingface/hub: /opt/hf/hub         # model weights only
      home_ro: [.local/bin, .local/share/claude, .local/share/uv/python]   # claude binary, base python of the env
      env:
        PYTHONPATH: /opt/push_tools
        GEAR_SONIC_DIR: /opt/gear_sonic
        MUJOCO_GL: egl
        HF_HOME: /opt/hf
        HF_HUB_OFFLINE: "1"
        OMP_NUM_THREADS: "4"
        PATH: ${oc.env:PWD}/.venv/bin:${oc.env:HOME}/.local/bin:/usr/bin:/bin

  env:
    use_api_key: true                        # keep ANTHROPIC_API_KEY in the sessions (API credit, no usage windows)
    unset_when_no_key: [ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN]
    set:
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      ENABLE_CLAUDEAI_MCP_SERVERS: "false"
      DISABLE_AUTOUPDATER: "1"
      MUJOCO_GL: egl
      PYTHONPATH: ${oc.env:PWD}
      PATH: ${oc.env:PWD}/.venv/bin:${oc.env:PATH}

  manifest: manifest.json                   # <out_root>/<manifest>
  cost:
    ledger: outputs/eval/cost_ledger.json    # utils/cost.py CostLedger
    stage: push_scene_gen
    log_dry_run: false
  copy_transcript: true                      # copy ~/.claude/projects/*/<session_id>.jsonl into <run>/_driver/ afterwards
