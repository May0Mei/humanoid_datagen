# @package _global_
# Stage episodes (kimodo env, GPU): HALO's push recipe, Kimodo approach ++ the clip, kinematic box, HALO gate.
# `run_steps`: encode, gen (episodes of this shard). Then episodes_render.
#   python humanoid_datagen/scripts/datagen.py --config_name datagen/push/halo_infinigen/episodes
defaults:
  - base
  - _self_

stage:
  _target_: humanoid_datagen.datagen_pipelines.halo_infinigen.episodes.HaloEpisodes
  run_steps: [encode, gen]
  device: cuda
  out_dir: outputs/push_box/halo_infinigen/episodes
  clip_csv: outputs/push_box/halo_infinigen/push_clip_contact/clip/clip_0.csv   # v4 clip_0 (30 fps, starts at the box)
  clip_lift: 0.02
  robot_mjcf: $THIRD_PARTY_ROOT/ml-halo/assets/robots/g1/mjcf/g1_29dof_v2_thor.xml               # kinematics (palms) for the box track
  standing_kf: $THIRD_PARTY_ROOT/ml-halo/datagen/motion_gen/kimodo/keyframes/single_kf_standpose.npz   # HALO's standing pose
  box_size: [0.46, 0.50, 0.561264]          # ml-halo/assets/objects/pushbox/pushbox.urdf
  box_rgba: [0.75, 0.65, 0.45, 1.0]         # pushbox.urdf "cardboard" (used when box_texture is unset)
  box_texture: humanoid_datagen/assets/pushbox_tex   # cardboard + packing tape + label (datagen_pipelines/halo_infinigen/box_texture.py)

  # 1. episode (scene-free frame: box centre at the origin, push along +x)
  spawn_dist: 1.3                           # pelvis -> box centre at the start (HALO's push_box task config)
  walk_speed: 0.55                          # HALO sit walk_speed (unicycle v_max)
  approach_prompt: "a person walks up to a cardboard box and bends over to push it."
  bend_frames: 30                           # free frames after the root path for the stand -> bend (1 s)
  walk_batch: 10                            # samples per episode (HALO Push: best of 10)
  seam_k: 3                                 # HALO seam_blend half-width at the approach -> clip seam
  steps: 200
  cfg: [2.0, 2.0]
  tier: industry                            # HALO motion_check gate tier (ranks the samples; verdict in meta.json)
  episodes: 2500
  episodes_per_scene: 50                    # episode k is rendered in scenes[k // 50]
  seed: 0

  # 2. render (HALO MuJoCo backend: baked room + G1, se2_fit placement, TPV pick, OAK pinhole -> fisheye)
  robot_render_mjcf: humanoid_datagen/assets/robots/g1/g1_29dof_official_oak1_mount.xml
  robot_meshes: humanoid_datagen/assets/robots/g1/meshes
  oak_calib: humanoid_datagen/assets/robots/g1/oak1_calibration.json   # oak1 pose in helmet_assembly_link (the adopted calibration;
                                            # the published baseline was rendered with one hand-eye run of it)
  oak_intrinsics: humanoid_datagen/assets/robots/g1/oak1_calibration.json   # Kannala-Brandt K + distortion for the fisheye warp
  scene_root: outputs/push_box/halo_infinigen/scenes/single
  scenes: [scene_000000, scene_000001, scene_000002, scene_000003, scene_000004, scene_000005, scene_000006,
           scene_000007, scene_000008, scene_000009, scene_000011, scene_000012, scene_000013, scene_000014,
           scene_000015, scene_000016, scene_000017, scene_000018, scene_000020, scene_000021, scene_000022,
           scene_000023, scene_000024, scene_000025, scene_000026, scene_000027, scene_000028, scene_000029,
           scene_000030, scene_000031, scene_000032, scene_000033, scene_000034, scene_000037, scene_000039,
           scene_000041, scene_000042, scene_000043, scene_000044, scene_000046, scene_000047, scene_000048,
           scene_000049, scene_000050, scene_000051, scene_000052, scene_000053, scene_000054, scene_000055,
           scene_000056]                    # the first 50 built (outputs/.../scenes/single); 10 spares after these
  width: 848
  height: 480
