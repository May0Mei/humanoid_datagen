# @package _global_
# HALO trained on the text push demos (vla/halo/push_text.yaml), GRScenes push eval with GEAR-SONIC.
#   python humanoid_datagen/scripts/eval.py --config_name eval/push/grscenes_halo_text
defaults:
  - grscenes_hold
  - _self_

evaluator:
  seeds: [0, 1, 2]
  planner:
    _target_: humanoid_datagen.vla.halo.HaloPlanner
    hcfg:
      config: humanoid_datagen/configs/vla/halo/push_text.yaml
      checkpoint: outputs/checkpoints/vla/halo_push_text/final_model.pt
      device: auto
      seed: 0
  results_root: outputs/eval/push/grscenes_v3/halo_text   # v3 tasks; v2 results stay in outputs/eval/push/grscenes/halo_text (runs resume by task_id: never mix the two)
