# @package _global_
# Text-prior ablation of the push-scene agent: identical sessions, tools, budget and permissions, but no video:
# prior/ holds only wan.txt (as the scene brief) and kimodo.txt.
#   python -m humanoid_datagen.scripts.run_build_scene --config_name push_box/agent_batch_text [dry_run=true]
defaults:
  - agent_batch
  - _self_

arm: push_text
arms:
  push_text: {source: push_text, out_root: outputs/push_box/scenes_text}
jobs:
  push:
    with_video: false
resume:                                    # usage limit: wait for the reset, then continue the stopped sessions
  max_waits: 10
  prompt: "Continue /push-scene out={run_dir} prior=text where you left off (the session was interrupted by a usage limit). Check what is already in the run dir, then finish and finalize."

claude:
  prompt: "/push-scene out={run_dir} prior=text"
  isolate:
    runtime_dir: tmp/push_box/agent_runtime_text     # own copy: each batch rebuilds its runtime at start
  deny_extra:
    - "Read(//**/*.mp4)"
    - "Read(//{run_dir}/prior_frames/**)"
    - "Read(//{repo}/outputs/push_box/scenes/**)"     # the video arm's runs
