# @package _global_
# Headless build-scene batch (one fresh `claude -p` session per scene), identical for both ablation arms:
#   python -m humanoid_datagen.scripts.run_build_scene --config_name scene/agent/batch arm=text  [dry_run=true]
#   python -m humanoid_datagen.scripts.run_build_scene --config_name scene/agent/batch arm=video [dry_run=true]
# or bash_scripts/agent/run_build_scene.bash <arm> [overrides]. Runs on the login node (claude needs the network).
# Only the prior differs between arms; model, effort, turn cap, budget, tools and permissions are shared below.
arm: text                         # text | video (one arm per invocation)
dry_run: false                    # print the exact commands, prepare run dirs, write a manifest skeleton; launch nothing
max_concurrent: 6                 # concurrent claude sessions (login node: keep <= 6)
max_attempts: 2                   # re-launch a run without result.json up to this many times (old dir is archived)
timeout_min: 150                  # wall-clock limit per session
session_tag: ""                    # prefix of the deterministic session ids; change it to re-run the same jobs
resume:                           # an attempt stopped by a subscription usage limit is continued, not restarted
  on_usage_limit: true
  limit_markers: ["hit your 5-hour limit", "hit your weekly limit", "usage limit"]
  prompt: "Continue /build-scene prior={arm} out={run_dir} where you left off (the session was interrupted by a usage limit). Check what is already in the run dir, then finish and finalize."
  max_waits: 0                    # >0: when a session hits the limit, launch nothing new, sleep until the reset time in
                                  # its message (+3 min), then resume the stopped runs and continue; up to this many times
  fallback_wait_min: 60           # sleep when the message has no parseable reset time
claude_bin: claude                # path to the CLI; a stub for tests: bash_scripts/agent/fake_claude.py

arms:                             # per-arm identity only; nothing here changes how the agent works
  text:  {source: agent_no_video, out_root: outputs/scenes/text}
  video: {source: ours, out_root: outputs/scenes/video}

jobs:
  seeds: [0]                      # replicates per prior (also the tools' RNG seed); run_id = <prior id>_s<seed>
  limit: null                     # first N jobs only (pilot)
  text:
    source: briefs                # briefs: template briefs (cli_briefs) | wan_prompt: the generation's wan.txt as brief
                                  # | prompt_file: outputs/prompts/<n>/<prompt_file> as brief
    prompt_file: brief.txt        # source=prompt_file only
    briefs_file: outputs/scenes/text/briefs_s0_n100.jsonl   # generated with briefs_config if missing
    briefs_config: scene/agent/briefs
    brief_ids: null               # e.g. [b0000, b0001]; null = all
    generations: []               # source=wan_prompt only
  video:
    generations: [2]              # outputs/generations/<n>
    video_file: wan_t2v_seed0.mp4 # the Wan t2v scene prior (never MiniMax edit*.mp4)
    prompt_files: [wan.txt, kimodo.txt]   # copied from outputs/prompts/<n>/; minimax.txt is the MiniMax-H3 edit prompt

claude:                           # shared by both arms
  model: opus
  effort: max
  max_turns: 120
  max_budget_usd: 20.0
  permission_mode: dontAsk        # anything not pre-allowed is denied, so a run can never hang on a prompt
  output_format: json
  tools: [Bash, Read, Write, Edit, Skill]
  prompt: "/build-scene prior={arm} out={run_dir}"
  allow:                          # {run_dir}, {repo}, {home}, {other_arm_root}: absolute paths without the leading "/", so "//{repo}" is absolute
    - "Bash(python -m humanoid_datagen.scenes.agent.cli *)"
    - "Read(//{run_dir}/**)"
    - "Edit(//{run_dir}/**)"       # Edit rules cover Write too
    - "Skill(build-scene)"
  deny_both:                      # read/edit restrictions identical in both arms ({repo}, {home}, {run_dir}, {other_arm_root})
    - "Read(//{repo}/outputs/eval/**)"            # evaluation scenes and results, incl. eval/scenes/specs/grscenes
    - "Read(//**/t_twin/**)"
    - "Read(//**/t_third/**)"
    - "Read(//**/grscenes/**)"
    - "Read(//**/GRScenes*/**)"
    - "Read(//{repo}/humanoid_datagen/scenes/specs/**)"   # playroom_gen2 spec
    - "Read(//{repo}/cache/**)"                   # cached HSSD specs, MiniMax code
    - "Read(//{repo}/tmp/**)"                     # scratch renders / comparisons of earlier runs
    - "Read(//{repo}/sim_scene/**)"
    - "Read(//{repo}/outputs/scenes/agent_no_video/**)"
    - "Read(//{repo}/outputs/scenes/agent_no_video_seedtest/**)"
    - "Read(//{repo}/outputs/datagen/**)"
    - "Read(//{repo}/outputs/generations/**)"     # the video arm gets its own prior copied into prior/
    - "Read(//{repo}/outputs/prompts/**)"
    - "Read(//{repo}/outputs/gallery.html)"
    - "Read(//**/edit_seed*.mp4)"
    - "Read(//{repo}/.claude/skills/video-to-sim/**)"
    - "Read(//{home}/.claude/projects/*/memory/**)"   # memory
    - "Read(//{home}/.claude/projects/*/*.jsonl)"     # other sessions' transcripts (the run's own large tool outputs
                                                      # are spilled to projects/<p>/<session>/tool-results/ and stay readable)
    - "Read(//{other_arm_root}/**)"
    - "Skill(video-to-sim)"
    - "WebFetch"
    - "WebSearch"
    - "Read(//{run_dir}/_driver/**)"              # policy, settings, command, logs: driver-only
    - "Edit(//{run_dir}/_driver/**)"
    - "Edit(//{run_dir}/prior/**)"
    - "Edit(//{run_dir}/.claude/**)"
    - "Edit(//{run_dir}/result.json)"             # written only by the finalize tool
    - "Edit(//{run_dir}/tool_log.jsonl)"          # the build count is read from here
  deny_text:                      # text arm only: no video or frame input of any kind
    - "Read(//**/*.mp4)"
    - "Read(//{run_dir}/prior_frames/**)"
  settings:                       # written to <run>/_driver/settings.json and passed with --settings
    permissions: {blockReadsOutsideWorkingDirectories: true}   # file tools + read-only Bash fenced to the run dir
    autoMemoryEnabled: false
  extra_args: [--strict-mcp-config]   # no MCP servers (none are configured with --mcp-config)
  isolate_git_root: true          # `git init` the run dir so project skills are discovered from it only
  copy_skill: .claude/skills/build-scene   # snapshot into <run>/.claude/skills/build-scene (cwd = run dir)

env:
  use_api_key: false              # false: unset the keys below in the child (run on the subscription login)
  unset_when_no_key: [ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN]
  set:
    CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
    ENABLE_CLAUDEAI_MCP_SERVERS: "false"
    DISABLE_AUTOUPDATER: "1"
    MUJOCO_GL: egl

manifest: manifest.json           # <out_root>/<manifest>
cost:
  ledger: outputs/eval/cost_ledger.json   # evaluation/cost.py CostLedger (make_tables reads it)
  stage: scene_gen
  log_dry_run: false
copy_transcript: true             # copy ~/.claude/projects/*/<session_id>.jsonl into <run>/_driver/ afterwards
